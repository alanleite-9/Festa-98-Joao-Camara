if (typeof THREE === 'undefined') { document.getElementById('err').style.display = 'flex'; throw new Error('Three.js não carregou'); }

/* ============ BASE DA CENA ============
   As coordenadas abaixo vêm da planta (em pixels do desenho).
   W() converte planta -> mundo (1 unidade ≈ 1 metro; a planta é "sem escala"). */
const W = (x, y) => [(x - 400) / 10, (y - 560) / 10];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b1f);
scene.fog = new THREE.FogExp2(0x0d0b1f, 0.006);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ============ AUXILIARES ============ */
const matCache = {};
const M = (c, o = {}) => {
  const k = c + JSON.stringify(o);
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.75, metalness: 0.05 }, o)));
};
// Caixa a partir de um retângulo da planta (x, y, largura, profundidade) + altura em metros
function B(x, y, w, d, h, c, y0 = 0, o = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w / 10, h, d / 10), M(c, o));
  const [X, Z] = W(x + w / 2, y + d / 2);
  m.position.set(X, y0 + h / 2, Z);
  scene.add(m);
  return m;
}
// Placa de texto (sprite)
function label(txt, x, y, h, s = 1) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(10,10,25,.72)'; g.fillRect(0, 0, 512, 96);
  let fs = 44; g.font = `bold ${fs}px Arial`;
  while (g.measureText(txt).width > 480) { fs--; g.font = `bold ${fs}px Arial`; }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 256, 50);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.scale.set(9 * s, 1.7 * s, 1);
  const [X, Z] = W(x, y); sp.position.set(X, h, Z);
  scene.add(sp);
}
// Tenda/barraca: balcão + teto + 2 postes
function booth(x, y, w, d, color) {
  B(x + 1, y + 1, w - 2, d - 2, 1.2, color);
  B(x - 2, y, w + 4, d, 0.15, '#f2efe6', 2.9);
  B(x, y + d / 2 - 1, 2, 2, 2.9, '#e0ddd2');
  B(x + w - 2, y + d / 2 - 1, 2, 2, 2.9, '#e0ddd2');
}
// Grade/isolamento (parede baixa translúcida)
function fence(a, b, h = 1.6) {
  const [x1, z1] = W(...a), [x2, z2] = W(...b);
  const len = Math.hypot(x2 - x1, z2 - z1);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, 0.12), M('#3b4cc0', { transparent: true, opacity: 0.55 }));
  m.position.set((x1 + x2) / 2, h / 2, (z1 + z2) / 2);
  m.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
  scene.add(m);
}

const logo = new Image(), redraws = [];
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const run = () => { draw(c.getContext('2d'), w, h); tex.needsUpdate = true; };
  run(); redraws.push(run); return tex;
}
function drawLogo(g, x, y, h) {
  if (logo.complete && logo.naturalWidth) g.drawImage(logo, x, y, h * logo.naturalWidth / logo.naturalHeight, h);
}
logo.onload = () => redraws.forEach(f => f());
logo.src = LOGO_SRC;

function pointLight(color, px, py, h, intensity = 1.4, dist = 30) {
  const l = new THREE.PointLight(color, intensity, dist, 2);
  const [X, Z] = W(px, py); l.position.set(X, h, Z); scene.add(l);
}

(function screenWall() {
  const tex = canvasTex(1536, 475, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, '#0d1b4a'); gr.addColorStop(0.55, '#3a1473'); gr.addColorStop(1, '#0a5a8a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.07)';
    for (let i = 0; i < 12; i++) g.fillRect(i * 140, 0, 60, h);
    const lh = h * 0.94, lw = lh * (logo.naturalWidth / logo.naturalHeight || 1.86);
    drawLogo(g, (w - lw) / 2, h * 0.03, lh);   // logo da festa no telão
  });
  screenMat = new THREE.MeshBasicMaterial({ map: tex });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(22, 6.8), screenMat);

    const gr = g.createLinearGradient(0, 0, cw, 0);
    gr.addColorStop(0, '#0b2a4f'); gr.addColorStop(1, '#1f6fb2');
    g.fillStyle = gr; g.fillRect(0, 0, cw, ch);
    g.fillStyle = '#F07A12'; g.fillRect(0, 0, cw, 16); g.fillRect(0, ch - 16, cw, 16);
    drawLogo(g, 30, 24, ch - 48);

    const cx = 1460;
    g.fillStyle = '#fff'; g.font = 'bold 84px Arial'; g.fillText('SEJAM', cx, 105);
    let fs = 180; g.font = 'bold ' + fs + 'px Arial';
    while (g.measureText('BEM-VINDOS').width > 1120) { fs -= 4; g.font = 'bold ' + fs + 'px Arial'; }
    g.fillStyle = '#FFD34D'; g.fillText('BEM-VINDOS', cx, 245);

}

function strand(a, b, n = 16, sag = 0.9) {

    d.updateMatrix(); bulbs.setMatrixAt(bi, d.matrix);
    bulbs.setColorAt(bi, new THREE.Color(palette[bi % palette.length])); bi++;
  }
}

/* ============ CÂMERA: TOUR (a pé + sobrevoo), ORBITAL E LIVRE ============
   Cada ponto: [x, y da planta, altura da câmera | x, y da planta, altura do alvo] */
const REYP = [420, 112, 3.6];
const K = [
  [270, 930, 1.8, 270, 780, 2], [270, 760, 1.8, 255, 600, 2], [255, 600, 1.8, 235, 420, 2], [250, 440, 1.8, ...REYP],
  [235, 330, 1.8, ...REYP], [210, 235, 1.8, ...REYP], [290, 320, 1.8, 410, 405, 2], [300, 520, 1.8, 410, 500, 2],
  [330, 650, 1.8, 410, 520, 2], [500, 650, 1.8, 700, 590, 2], [590, 560, 1.8, 700, 590, 2],
  [580, 700, 1.8, 640, 900, 2], [640, 880, 1.8, 640, 1040, 2], [640, 1000, 1.8, 640, 1080, 2],
  [620, 1060, 12, 500, 700, 2], [560, 800, 28, 400, 400, 2], [500, 500, 42, 400, 250, 0],
  [250, 330, 30, ...REYP], [130, 600, 30, 300, 500, 0], [200, 850, 12, 270, 900, 2]
];
const v3 = (x, y, h) => { const [X, Z] = W(x, y); return new THREE.Vector3(X, h, Z); };
const posCurve = new THREE.CatmullRomCurve3(K.map(k => v3(k[0], k[1], k[2])), true, 'centripetal');
const lookCurve = new THREE.CatmullRomCurve3(K.map(k => v3(k[3], k[4], k[5])), true, 'centripetal');
const TOUR_SECONDS = 170;

const cSkin = M('#c98d63'), cShirt = M('#f4efe3'), cJeans = M('#1f3a6b'), cHat = M('#b98a4e'), cBoot = M('#4b2e1a'), cDark = M('#1a1a1a');
[-0.17, 0.17].forEach(x => { part(new THREE.BoxGeometry(0.26, 0.85, 0.3), cJeans, x, 0.52, 0); part(new THREE.BoxGeometry(0.28, 0.14, 0.42), cBoot, x, 0.07, 0.05); });

function makeArm(side) {

  part(lo, cShirt, 0, 0, 0, el); part(new THREE.SphereGeometry(0.075, 8, 8), cSkin, 0, -0.34, 0, el);
  return { sh, el };
}
const armR = makeArm(1), armL = makeArm(-1);

function animateRey(t) {
  const syl = Math.abs(Math.sin(t * 7.3) * Math.sin(t * 1.9 + 1));       // "sílabas" da canção

  armR.sh.rotation.set(-0.35, 0, -0.25); armR.el.rotation.x = -2.6 + Math.sin(t * 3) * 0.1;   // mic perto da boca
  armL.sh.rotation.z = -(2.3 + Math.sin(t * 5) * 0.3);                                         // braço levantado, acenando
}

/* ============ PÚBLICO CURTINDO A FESTA ============ */
const people = [];
const rnd = (() => { let sd = 12345; return () => (sd = (sd * 16807) % 2147483647) / 2147483647; })();
const pick = a => a[Math.floor(rnd() * a.length)];
const walkPts = posCurve.getPoints(600).filter(p => p.y < 3);                 // corredor livre para a câmera a pé
const nearWalk = (x, z) => walkPts.some(p => Math.hypot(p.x - x, p.z - z) < 1.7);
const stageXZ = W(420, 112);
function addPerson(x, z, seated, yaw) {
  people.push({ x, z, seated, yaw, ph: rnd() * 6.28, e: 0.5 + rnd(), hat: rnd() < 0.35,
    arms: seated ? 2 : (rnd() < 0.6 ? 1 : rnd() < 0.5 ? 0 : 3) });
}
[[110, 165, 320, 390, 120, 1], [495, 230, 575, 440, 48, 1], [190, 400, 320, 780, 58, 0], [500, 450, 655, 780, 52, 0]].forEach(([x0, y0, x1, y1, n, facing]) => {
  let tries = 0, added = 0;
  while (added < n && tries++ < n * 40) {
    const [X, Z] = W(x0 + rnd() * (x1 - x0), y0 + rnd() * (y1 - y0));
    if (nearWalk(X, Z) || people.some(q => Math.hypot(q.x - X, q.z - Z) < 0.85)) continue;
    addPerson(X, Z, false, facing ? Math.atan2(stageXZ[0] - X, stageXZ[1] - Z) : rnd() * 6.28);
    added++;
  }
});
tablePos.forEach(([X, Z]) => {                                                // gente sentada nas mesas da praça
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2 + Math.PI / 4, cx = X + Math.cos(a) * 1.05, cz = Z + Math.sin(a) * 1.05;
    if (rnd() < 0.6 && !nearWalk(cx, cz)) addPerson(cx, cz, true, Math.atan2(X - cx, Z - cz));
  }
});
const N = people.length, stdMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
const mk = (geo) => { const m = new THREE.InstancedMesh(geo, stdMat, N); m.frustumCulled = false; scene.add(m); return m; };
const armGeo = new THREE.BoxGeometry(0.1, 0.55, 0.1); armGeo.translate(0, -0.275, 0);
const iLegs = mk(new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8)), iTorso = mk(new THREE.CylinderGeometry(0.24, 0.27, 0.62, 10));
const iHead = mk(new THREE.SphereGeometry(0.17, 10, 8)), iHat = mk(new THREE.CylinderGeometry(0.14, 0.32, 0.12, 12));
const iArmL = mk(armGeo), iArmR = mk(armGeo);
const shirts = ['#e63946', '#f4a261', '#2a9d8f', '#e9c46a', '#3d5a80', '#ffffff', '#9b5de5', '#00bbf9', '#f15bb5', '#8ac926'];
const skins = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#6b4226', '#ffdbac'];
const jeansC = ['#1f3a6b', '#2b2b2b', '#3b5b92'], hats = ['#d8b878', '#8a5a2b', '#f1e3b8', '#222222'];
people.forEach((p, i) => {
  const sk = new THREE.Color(pick(skins));
  iLegs.setColorAt(i, new THREE.Color(pick(jeansC))); iTorso.setColorAt(i, new THREE.Color(pick(shirts)));
  iHead.setColorAt(i, sk); iArmL.setColorAt(i, sk); iArmR.setColorAt(i, sk); iHat.setColorAt(i, new THREE.Color(pick(hats)));
});
const dm = new THREE.Object3D(); dm.rotation.order = 'YXZ';
function put(mesh, i, x, y, z, ry, rx, rz, sc = 1) {
  dm.position.set(x, y, z); dm.rotation.set(rx, ry, rz); dm.scale.setScalar(sc); dm.updateMatrix(); mesh.setMatrixAt(i, dm.matrix);
}
function updateCrowd(t) {
  const beat = t * 13.2;                                                        // ~126 bpm
  for (let i = 0; i < N; i++) {
    const p = people[i], s = Math.sin(beat + p.ph), w = Math.sin(beat * 0.5 + p.ph) * 0.35;
    const bob = p.seated ? 0.015 * s : Math.abs(s) * 0.1 * p.e, yb = (p.seated ? -0.34 : 0) + bob;
    const c = Math.cos(p.yaw), sn = Math.sin(p.yaw);
    put(iLegs, i, p.x, 0.4 + bob, p.z, p.yaw, 0, 0, p.seated ? 0.001 : 1);
    put(iTorso, i, p.x, 1.1 + yb, p.z, p.yaw, 0, w * 0.25);
    put(iHead, i, p.x, 1.58 + yb, p.z, p.yaw, 0, 0);
    put(iHat, i, p.x, 1.76 + yb, p.z, p.yaw, 0, 0, p.hat ? 1 : 0.001);
    let rxR = 0, rxL = 0, rzR = 0.15 + s * 0.1, rzL = -0.15 - s * 0.1;
    if (p.arms === 1) { rzR = 2.4 + w; rzL = -(2.4 - w); }                       // as duas mãos para cima
    else if (p.arms === 3) rzR = 2.5 + w;                                        // uma mão para cima
    else if (p.arms === 2) { rxR = rxL = -1.1 + s * 0.1; rzR = 0.15; rzL = -0.15; } // sentado, segurando copo
    put(iArmR, i, p.x + c * 0.3, 1.32 + yb, p.z - sn * 0.3, p.yaw, rxR, rzR);
    put(iArmL, i, p.x - c * 0.3, 1.32 + yb, p.z + sn * 0.3, p.yaw, rxL, rzL);
  }
  [iLegs, iTorso, iHead, iHat, iArmL, iArmR].forEach(m => m.instanceMatrix.needsUpdate = true);
}

let mode = 'tour', playing = true, tt = 0, orbitAngle = 0;
const sph = { theta: 0.6, phi: 0.95, r: 95 };

function setMode(m) {
  mode = m;
  ['tour', 'orbit', 'free'].forEach(k => document.getElementById('b-' + k).classList.toggle('on', k === m));
}
document.getElementById('b-tour').onclick = () => setMode('tour');
document.getElementById('b-orbit').onclick = () => setMode('orbit');
document.getElementById('b-free').onclick = () => setMode('free');
const pauseBtn = document.getElementById('b-pause');
pauseBtn.onclick = () => { playing = !playing; pauseBtn.textContent = playing ? 'Pausar animação' : 'Retomar animação'; };

// Controle do modo livre (mouse/toque)
let drag = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', () => drag = null);
el.addEventListener('pointermove', e => {
  if (!drag || mode !== 'free') return;
  sph.theta -= (e.clientX - drag[0]) * 0.006;
  sph.phi = Math.min(1.5, Math.max(0.15, sph.phi - (e.clientY - drag[1]) * 0.006));
  drag = [e.clientX, e.clientY];
});
el.addEventListener('wheel', e => { sph.r = Math.min(160, Math.max(12, sph.r * (1 + e.deltaY * 0.001))); }, { passive: true });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ============ LOOP DE ANIMAÇÃO ============ */
const clock = new THREE.Clock(); let time = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) { time += dt; tt += dt; orbitAngle += dt * 0.09; }

  // Câmera
  if (mode === 'tour') {
    const u = (tt / TOUR_SECONDS) % 1;
    camera.position.copy(posCurve.getPoint(u));
    camera.lookAt(lookCurve.getPoint(u));
  } else if (mode === 'orbit') {
    camera.position.set(Math.cos(orbitAngle) * 70, 42, Math.sin(orbitAngle) * 85);
    camera.lookAt(0, 0, 0);
  } else {
    camera.position.set(
      sph.r * Math.sin(sph.phi) * Math.cos(sph.theta),
      sph.r * Math.cos(sph.phi),
      sph.r * Math.sin(sph.phi) * Math.sin(sph.theta));
    camera.lookAt(0, 0, 0);
  }

  // Público, Rey Vaqueiro e telão
  updateCrowd(time); animateRey(time);
  screenMat.color.setScalar(0.88 + 0.12 * Math.sin(time * 2));
  // Refletores do palco varrendo a pista
  spots.forEach(({ L, beam, i }) => {
    const [X, Z] = W(205 + Math.sin(time * 0.7 + i * 2) * 85, 270 + Math.cos(time * 0.5 + i) * 70);
    L.target.position.set(X, 0, Z);
    beam.lookAt(L.target.position);
  });

  renderer.render(scene, camera);
}
animate();
